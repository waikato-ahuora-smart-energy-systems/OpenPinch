version: 2
updates:
  # Keeps the SHA-pinned actions current; the "# vX.Y.Z" comments are updated too.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Refreshes uv.lock so locked (mostly transitive) packages pick up fixes.
  # No target-branch: Dependabot security updates only use entries for the
  # default branch (develop), and open their own PRs as soon as an alert
  # appears. This monthly run batches everything else.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      locked-dependencies:
        patterns: ["*"]
