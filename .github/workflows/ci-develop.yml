name: CI Develop

on:
  push:
    branches: ["develop"]

permissions:
  contents: read

concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14.2"
  UV_VERSION: "0.11.29"

jobs:
  detect-main-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.open_pr.outputs.should_run }}
    steps:
      - name: Detect an open ready develop-to-main pull request
        id: open_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          should_run="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:develop" \
            -f base="main" \
            --jq 'if map(select(.draft == false)) | length == 0 then "true" else "false" end')"
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"

  test:
    needs: detect-main-pr
    if: ${{ needs.detect-main-pr.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/check_lockfile_version.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync coverage run --branch --source=OpenPinch -m pytest --hypothesis-seed=20260715 -m "not solver"
      - run: uv run --no-sync coverage report --fail-under=95

  docs:
    needs: detect-main-pr
    if: ${{ needs.detect-main-pr.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/build_docs.py

  optional-install-smoke:
    needs: detect-main-pr
    if: ${{ needs.detect-main-pr.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        surface: [core, dashboard, notebook, brayton_cycle, synthesis]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
      - name: Install locked package surface
        env:
          SURFACE: ${{ matrix.surface }}
        run: |
          case "${SURFACE}" in
            core) uv sync --frozen --no-default-groups ;;
            *) uv sync --frozen --no-default-groups --extra "${SURFACE}" ;;
          esac
      - run: uv run --no-sync python scripts/optional_install_smoke.py ${{ matrix.surface }}

  artifact-build:
    needs: detect-main-pr
    if: ${{ needs.detect-main-pr.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: false
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/build_dist.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openpinch-dist
          path: dist/*
          if-no-files-found: error

  artifact-install-smoke:
    needs: [detect-main-pr, artifact-build]
    if: ${{ needs.detect-main-pr.outputs.should_run == 'true' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          save-cache: ${{ runner.os != 'Linux' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openpinch-dist
          path: dist
      - run: uv sync --frozen --no-default-groups
      - run: uv pip install --python .venv --no-deps --reinstall --no-index --find-links dist OpenPinch
      - run: uv run --no-sync python scripts/artifact_install_smoke.py
