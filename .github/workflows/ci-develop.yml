name: CI Develop
on:
  push:
    branches: ["develop"]
permissions:
  contents: read
  actions: read
concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/ci-validation.yml
    with:
      candidate: ${{ github.sha }}
      profile: integration
