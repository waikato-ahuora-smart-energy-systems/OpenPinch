name: Validate, Release & Publish

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14.2"
  UV_VERSION: "0.11.29"

jobs:
  release-check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --no-default-groups
      - run: uv run --no-sync python scripts/check_lockfile_version.py
      - name: Resolve and validate release identity
        id: release
        run: |
          set -euo pipefail
          version="$(uv run --no-sync python scripts/check_release_version.py)"
          tag="v${version}"
          uv run --no-sync python scripts/check_release_tag.py "${tag}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
            if [ "${tagged_commit}" != "${GITHUB_SHA}" ]; then
              echo "Release tag ${tag} already points to ${tagged_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

  test:
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/check_lockfile_version.py
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync coverage run --branch --source=OpenPinch -m pytest --hypothesis-seed=20260715 -m "not solver"
      - run: uv run --no-sync coverage report --fail-under=95

  docs:
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/build_docs.py

  optional-install-smoke:
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        surface: [core, dashboard, notebook, brayton_cycle, synthesis]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install locked package surface
        env:
          SURFACE: ${{ matrix.surface }}
        run: |
          case "${SURFACE}" in
            core) uv sync --frozen --no-default-groups ;;
            *) uv sync --frozen --no-default-groups --extra "${SURFACE}" ;;
          esac
      - run: uv run --no-sync python scripts/optional_install_smoke.py ${{ matrix.surface }}

  solver-tests:
    needs: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Install IDAES solver binaries
        run: uv run --no-sync idaes get-extensions
      - run: uv run --no-sync pytest --hypothesis-seed=20260715 -m "solver"

  build:
    needs: [test, docs, optional-install-smoke, solver-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --no-sync python scripts/build_dist.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openpinch-dist
          path: dist/*
          if-no-files-found: error

  artifact-install-smoke:
    needs: build
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openpinch-dist
          path: dist
      - run: uv sync --frozen --no-default-groups
      - run: uv pip install --python .venv --no-deps --reinstall --no-index --find-links dist OpenPinch
      - run: uv run --no-sync python scripts/artifact_install_smoke.py

  create-draft-release:
    needs: [release-check, artifact-install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openpinch-dist
          path: dist
      - name: Create annotated tag and draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-check.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/${TAG_NAME}^{commit}"; then
            tagged_commit="$(git rev-list -n 1 "refs/tags/${TAG_NAME}")"
            if [ "${tagged_commit}" != "${GITHUB_SHA}" ]; then
              echo "Release tag ${TAG_NAME} points to ${tagged_commit}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            git tag -a "${TAG_NAME}" -m "OpenPinch ${TAG_NAME}"
            git push origin "refs/tags/${TAG_NAME}"
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* --draft --generate-notes --title "OpenPinch ${TAG_NAME}"
          fi

  publish-testpypi:
    needs: [release-check, create-draft-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openpinch-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [release-check, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/OpenPinch/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openpinch-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  finalize-release:
    needs: [release-check, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release after PyPI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-check.outputs.tag }}
        run: gh release edit "${TAG_NAME}" --draft=false --latest
