name: Explicit Release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: New release or resume the original verified bundle
        type: choice
        options: [new, resume]
        default: new
      version:
        description: Exact committed X.Y.Z version to publish
        type: string
        required: true
      source_run_id:
        description: Original build run ID (resume only)
        type: string
      source_artifact_id:
        description: Original immutable artifact ID (resume only)
        type: string
      source_artifact_digest:
        description: Original sha256 artifact digest (resume only)
        type: string
permissions:
  contents: read
concurrency:
  group: openpinch-release
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - name: Validate deliberate main-context release request
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [ "$MODE" = new ]; then
            test -z "$SOURCE_RUN_ID$SOURCE_ARTIFACT_ID$SOURCE_ARTIFACT_DIGEST"
            test "$(python scripts/check_release_version.py)" = "$VERSION"
            python scripts/check_lockfile_version.py
            if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
              echo "Version already staged. Resume its original bundle; do not rebuild." >&2
              exit 1
            fi
          else
            test "$MODE" = resume
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi

  validation:
    needs: request
    if: ${{ inputs.mode == 'new' }}
    uses: ./.github/workflows/ci-validation.yml
    with:
      candidate: ${{ github.sha }}
      profile: full

  bundle:
    if: ${{ always() && needs.request.result == 'success' && (needs.validation.result == 'success' || (inputs.mode == 'resume' && needs.validation.result == 'skipped')) }}
    needs: [request, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.identity.outputs.artifact_id }}
      artifact_digest: ${{ steps.identity.outputs.artifact_digest }}
      run_id: ${{ steps.identity.outputs.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_ARTIFACT_ID: ${{ inputs.mode == 'new' && needs.validation.outputs.artifact_id || inputs.source_artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ inputs.mode == 'new' && needs.validation.outputs.artifact_digest || inputs.source_artifact_digest }}
      SOURCE_RUN_ID: ${{ inputs.mode == 'new' && github.run_id || inputs.source_run_id }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - name: Verify complete source evidence and original bytes
        run: |
          python -m scripts.release_manifest verify --directory bundle
          python -c 'import json,os; m=json.load(open("bundle/release-manifest.json")); assert m["version"] == os.environ["VERSION"]; assert str(m["run_id"]) == os.environ["SOURCE_RUN_ID"]'
      - id: identity
        run: |
          {
            echo "artifact_id=$SOURCE_ARTIFACT_ID"
            echo "artifact_digest=$SOURCE_ARTIFACT_DIGEST"
            echo "run_id=$SOURCE_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Recovery identity: run=$SOURCE_RUN_ID artifact=$SOURCE_ARTIFACT_ID digest=$SOURCE_ARTIFACT_DIGEST version=$VERSION" >> "$GITHUB_STEP_SUMMARY"

  stage:
    if: ${{ !cancelled() && needs.bundle.result == 'success' }}
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest stage --directory bundle

  preflight-testpypi:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.stage.result == 'success' }}
    needs: [bundle, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.inspect.outputs.status }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest verify --directory bundle
      - id: inspect
        run: |
          status="$(python scripts/check_package_index_release.py --index-url https://test.pypi.org/pypi --version "$VERSION" --dist-dir bundle --allow-partial)"
          echo "status=$status" >> "$GITHUB_OUTPUT"

  publish-testpypi:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.preflight-testpypi.result == 'success' }}
    needs: [bundle, preflight-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest verify --directory bundle
      - name: Prepare only verified distribution files
        run: |
          mkdir upload
          cp bundle/*.whl bundle/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: ${{ needs.preflight-testpypi.outputs.status != 'complete' }}
        with:
          packages-dir: upload/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.publish-testpypi.result == 'success' }}
    needs: [bundle, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest verify --directory bundle
      - run: python scripts/check_package_index_release.py --index-url https://test.pypi.org/pypi --version "$VERSION" --dist-dir bundle --require-complete

  preflight-pypi:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.verify-testpypi.result == 'success' }}
    needs: [bundle, verify-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.inspect.outputs.status }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest verify --directory bundle
      - id: inspect
        run: |
          status="$(python scripts/check_package_index_release.py --index-url https://pypi.org/pypi --version "$VERSION" --dist-dir bundle --allow-partial)"
          echo "status=$status" >> "$GITHUB_OUTPUT"

  publish-pypi:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.preflight-pypi.result == 'success' }}
    needs: [bundle, preflight-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/OpenPinch/
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest verify --directory bundle
      - name: Prepare only verified distribution files
        run: |
          mkdir upload
          cp bundle/*.whl bundle/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: ${{ needs.preflight-pypi.outputs.status != 'complete' }}
        with:
          packages-dir: upload/
          skip-existing: true

  verify-pypi:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.publish-pypi.result == 'success' }}
    needs: [bundle, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest verify --directory bundle
      - run: python scripts/check_package_index_release.py --index-url https://pypi.org/pypi --version "$VERSION" --dist-dir bundle --require-complete

  finalize-release:
    if: ${{ !cancelled() && needs.bundle.result == 'success' && needs.verify-pypi.result == 'success' }}
    needs: [bundle, verify-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_ARTIFACT_ID: ${{ needs.bundle.outputs.artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ needs.bundle.outputs.artifact_digest }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - run: python -m scripts.release_manifest download --directory bundle
      - run: python -m scripts.release_manifest finalize --directory bundle
