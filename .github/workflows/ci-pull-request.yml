name: PR Validation
on:
  pull_request:
    branches: ["main", "develop"]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'candidate' }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.event.outputs.run }}
      profile: ${{ steps.event.outputs.profile }}
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - id: event
        run: python -m scripts.plan_ci_event
      - id: proof
        if: ${{ steps.event.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.reuse_develop_ci

  validation:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    uses: ./.github/workflows/ci-validation.yml
    with:
      candidate: ${{ github.sha }}
      profile: ${{ needs.plan.outputs.profile }}
      reuse-integration: ${{ needs.plan.outputs.reuse == 'true' }}

  pr-gate:
    name: OpenPinch PR Gate
    if: ${{ always() }}
    needs: [plan, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require complete validation
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          RUN_VALIDATION: ${{ needs.plan.outputs.run }}
          CANDIDATE: ${{ github.sha }}
        run: |
          echo "Evaluated candidate: ${CANDIDATE}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RUN_VALIDATION" != true ]; then
            echo "No new proof: draft or metadata-only event. Reopen the ready PR or push a source change to validate." >&2
            exit 1
          fi
          test "$PLAN_RESULT" = success
          test "$VALIDATION_RESULT" = success

  test:
    name: test
    if: ${{ always() }}
    needs: pr-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Transitional complete-gate compatibility check
        env:
          GATE_RESULT: ${{ needs.pr-gate.result }}
        run: test "$GATE_RESULT" = success
