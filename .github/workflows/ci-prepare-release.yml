name: Prepare Release
on:
  workflow_run:
    workflows: ["PR Validation", "Review Notification"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openpinch-release-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # workflow_run/dispatch executes trusted main code, never candidate code.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14.2"
      - name: Reconcile approved review and version preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release_preparation reconcile
