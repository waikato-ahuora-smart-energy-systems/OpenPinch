version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    # Install from uv.lock, as CI does, so an upstream release cannot break
    # the docs build while CI stays green. Keep uv in step with ci.yml.
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.11.29
      - asdf global uv 0.11.29
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --no-dev --group docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
