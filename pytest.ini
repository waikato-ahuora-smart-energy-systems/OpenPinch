# OpenPinch/pytest.ini

[pytest]
testpaths = tests
pythonpath = .
markers =
    synthesis: optional heat exchanger network synthesis tests that require the synthesis extra but no external solver binary
    solver: tests that require external solver binaries such as Couenne or IPOPT
    tespy: tests that require the optional TESPy HPR simulation extra
    performance: bounded convergence and runtime benchmark tests
    docs: warning-strict documentation build tests
    tutorial_profile: packaged tutorial notebook execution (slow HPR notebooks also carry tespy, HEN notebooks solver)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
